<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chinese Lessons{% endblock %}</title>
  <style>
    :root { font: 16px/1.5 system-ui, sans-serif; color: #20252b; background: #f5f4f0; }
    body { max-width: 1050px; margin: 0 auto; padding: 1.5rem; }
    header, nav, .card, fieldset { background: white; border: 1px solid #deded8; border-radius: 10px; }
    header { padding: 1rem 1.25rem; }
    nav { display: flex; gap: 1rem; padding: .75rem 1.25rem; margin: .75rem 0 1.5rem; }
    a { color: #175b72; }
    .card { padding: 1rem 1.25rem; margin: 1rem 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
    .stat { display: flex; flex-direction: column; gap: .25rem; padding: 1rem; background: #f5f4f0; border-radius: 8px; }
    a.stat { color: inherit; text-decoration: none; }
    a.stat:hover { border-color: #175b72; }
    .stat strong { font-size: 2rem; line-height: 1.2; }
    .status-bar { display: flex; width: 100%; height: 2rem; overflow: hidden; border-radius: 6px; background: #deded8; }
    .status-segment { display: block; height: 100%; }
    .status-new { background: #4677aa; }
    .status-learning { background: #d3a52c; }
    .status-reviewing { background: #27835a; }
    .status-relearning { background: #bd6247; }
    .status-suspended { background: #765c92; }
    .status-unmatched { background: #adb5ba; }
    .status-legend { display: flex; flex-wrap: wrap; gap: .4rem 1.25rem; padding: 0; list-style: none; }
    .status-legend li { display: flex; align-items: center; gap: .4rem; }
    .status-swatch { display: inline-block; width: .9rem; height: .9rem; border-radius: 2px; }
    .word-list li { margin: .8rem 0; }
    .word-list details { margin: .2rem 0 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .6rem; border-bottom: 1px solid #deded8; text-align: left; white-space: nowrap; }
    th { background: #f5f4f0; }
    fieldset { padding: 1rem; margin: 1rem 0; }
    legend { font-weight: 700; padding: 0 .4rem; }
    label { display: block; font-weight: 600; margin: .25rem 0; }
    input, textarea, select { box-sizing: border-box; width: 100%; padding: .55rem; border: 1px solid #b9bfbd; border-radius: 5px; font: inherit; }
    .entry-row { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: .65rem; padding: .8rem 0; border-bottom: 1px solid #eee; }
    .entry-row .wide { grid-column: span 2; }
    button { border: 0; border-radius: 5px; padding: .6rem .9rem; background: #175b72; color: white; font: inherit; cursor: pointer; }
    button.secondary { background: #5b6468; }
    .errors, .messages { color: #8c2525; }
    .success { color: #17633d; background: #e9f5ed; padding: .75rem; border-radius: 6px; }
    .error { color: #8c2525; background: #fbecec; padding: .75rem; border-radius: 6px; }
    .muted { color: #626a6c; }
    @media (max-width: 760px) { body { padding: .75rem; } .entry-row { grid-template-columns: repeat(2, minmax(120px, 1fr)); } }
  </style>
</head>
<body>
  <header><h1>Chinese Lessons</h1><div class="muted">Build vocabulary from lesson context.</div></header>
  <nav><a href="{% url 'home' %}">Home</a><a href="{% url 'progress' %}">Progress</a><a href="{% url 'lesson-list' %}">Lessons</a><a href="{% url 'word-list' %}">Words</a><a href="{% url 'source-create' %}">Add a source</a><a href="{% url 'lesson-create' %}">Add a lesson</a><a href="{% url 'admin:index' %}">Admin</a></nav>
  {% if messages %}<div class="messages">{% for message in messages %}<p class="{{ message.tags }}">{{ message }}</p>{% endfor %}</div>{% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
